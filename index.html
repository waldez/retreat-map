<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- substituted to "owner/repo@branch" by publish.py; left as-is = tags read-only -->
  <meta name="tags-repo" content="waldez/retreat-map@main">
  <title>retreat — mapa nálezů</title>
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <style>
    html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; }
    #app { display: flex; height: 100%; }
    #sidebar { width: 260px; padding: 12px 14px; overflow-y: auto;
               background: #fafafa; border-right: 1px solid #ddd; box-sizing: border-box; }
    #map { flex: 1; min-width: 0; }
    h1 { font-size: 15px; margin: 0 0 4px; }

    /* --- sidebar toggle --------------------------------------------------
       Desktop: sidebar is a column, open by default, collapsible.
       Mobile: sidebar is an off-canvas drawer over the map, closed by default,
       so the map is usable in portrait without rotating the phone. */
    #sidebar-toggle { position: fixed; top: 10px; right: 10px; z-index: 1200;
                      width: 40px; height: 40px; border: 1px solid #bbb; border-radius: 6px;
                      background: #fff; color: #222; font-size: 17px; line-height: 1;
                      cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
    #backdrop { display: none; position: fixed; inset: 0; z-index: 1100;
                background: rgba(0,0,0,.35); }
    body:not(.nav-open) #sidebar { display: none; }

    @media (max-width: 700px) {
      #sidebar { position: fixed; z-index: 1150; top: 0; left: 0; height: 100%;
                 width: min(280px, 82vw); border-right: 1px solid #ccc;
                 box-shadow: 2px 0 8px rgba(0,0,0,.25); }
      body.nav-open #backdrop { display: block; }
    }
    .crosslink { display: inline-block; font-size: 12px; margin-bottom: 8px; }
    #count { color: #555; font-size: 12px; margin-bottom: 12px; }
    fieldset { border: 1px solid #ddd; border-radius: 6px; margin: 0 0 12px; padding: 8px 10px; }
    legend { font-weight: 600; padding: 0 4px; }
    label { display: block; margin: 3px 0; cursor: pointer; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
              margin-right: 5px; vertical-align: middle; }
    input[type="number"] { width: 100px; }
    .popup-card h2 { font-size: 14px; margin: 0 0 4px; }
    .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; color: #fff;
             font-size: 11px; font-weight: 600; }
    .price { font-weight: 600; margin-left: 6px; }
    .chips { margin: 6px 0; }
    .chip { display: inline-block; background: #eee; border-radius: 8px; padding: 1px 6px;
            margin: 1px 2px; font-size: 11px; }
    /* --- tags (thumb-sized: >= 44px tap targets) --- */
    .tag-row { margin: 6px 0; font-size: 18px; }
    .tag-btn { min-width: 44px; min-height: 44px; margin: 0 4px 4px 0; font-size: 20px;
               border: 1px solid #bbb; border-radius: 8px; background: #fff; opacity: .45; }
    .tag-btn.on { opacity: 1; background: #fff3c4; border-color: #e0a800; }
    .tag-dispute { font-size: 12px; color: #6a1b9a; margin: 2px 0 6px; }
    ul.notes { margin: 4px 0; padding-left: 16px; font-size: 12px; }
    .note-meta { color: #888; font-size: 11px; }
    .note-del { min-width: 44px; min-height: 44px; border: none; background: none; font-size: 16px; }
    .note-add textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; }
    .note-add button, #tag-settings button { min-height: 44px; padding: 0 12px; margin-top: 4px; }
    #tag-settings input { width: 100%; box-sizing: border-box; font-size: 16px; min-height: 44px; }
    .tag-msg { font-size: 12px; color: #555; margin: 4px 0; }
    .tag-err { color: #c62828; }
    /* Tag emoji sits INSIDE its circle (box = circle diameter, see PIN_RADIUS),
       so the circle itself is the outline. Two tags spill evenly both sides. */
    .pin-badge { display: flex; align-items: center; justify-content: center;
                 font-size: 13px; line-height: 1; white-space: nowrap; pointer-events: none; }
    .btns a { display: inline-block; margin: 4px 6px 0 0; padding: 4px 9px; border-radius: 5px;
              background: #1565c0; color: #fff; text-decoration: none; font-size: 12px; }
  </style>
</head>
<body>
  <!-- decide the drawer's initial state before first paint, so phones never
       flash the sidebar and desktops never flash a collapsed one -->
  <script>
    if (!window.matchMedia("(max-width: 700px)").matches)
      document.body.classList.add("nav-open");
  </script>
  <button id="sidebar-toggle" type="button" aria-controls="sidebar"
          aria-expanded="false" aria-label="Filtry">☰</button>
  <div id="backdrop"></div>
  <div id="app">
    <aside id="sidebar">
      <h1>retreat — mapa nálezů</h1>
      <a href="list.html" class="crosslink">List view →</a>
      <div id="count">načítání…</div>

      <fieldset id="f-tier">
        <legend>Vhodnost</legend>
        <label><input type="checkbox" data-tier="primary_candidate" checked>
          <span class="swatch" style="background:#2e7d32"></span>kandidát</label>
        <label><input type="checkbox" data-tier="primary_conditional" checked>
          <span class="swatch" style="background:#1565c0"></span>podmíněně</label>
        <label><input type="checkbox" data-tier="secondary" checked>
          <span class="swatch" style="background:#f9a825"></span>sekundární</label>
        <label><input type="checkbox" data-tier="avoid">
          <span class="swatch" style="background:#c62828"></span>vyhnout se</label>
        <label><input type="checkbox" data-tier="unknown">
          <span class="swatch" style="background:#757575"></span>neznámé</label>
      </fieldset>

      <fieldset>
        <legend>Cena</legend>
        <label>max Kč: <input type="number" id="f-maxprice" step="50000" min="0"
                              placeholder="bez limitu"></label>
        <label><input type="checkbox" id="f-unpriced" checked> zahrnout bez ceny</label>
      </fieldset>

      <fieldset>
        <legend>Druh pozemku</legend>
        <div class="btns">
          <button type="button" id="d-all">vše</button>
          <button type="button" id="d-none">nic</button>
        </div>
        <div id="f-druh"></div>
      </fieldset>

      <fieldset>
        <legend>Typ / příznaky</legend>
        <label><input type="checkbox" id="f-struct"> jen stavby (dům/chata)</label>
        <div id="f-flags"></div>
      </fieldset>

      <fieldset id="f-tags">
        <legend>Štítky</legend>
        <label><input type="checkbox" data-only="fav"> jen ⭐</label>
        <label><input type="checkbox" data-only="visit"> jen 🚗</label>
        <label><input type="checkbox" data-only="dead"> jen 💀</label>
        <label><input type="checkbox" id="f-nope"> ukázat 👎</label>
        <div id="tag-msg" class="tag-msg"></div>
        <details id="tag-settings">
          <summary>⚙ token</summary>
          <div id="tag-token-state" class="tag-msg"></div>
          <input type="password" id="tag-token" autocomplete="off" spellcheck="false"
                 placeholder="github_pat_…" aria-label="GitHub token">
          <button type="button" id="tag-token-save">uložit</button>
          <button type="button" id="tag-token-clear">smazat</button>
        </details>
      </fieldset>
    </aside>
    <div id="map"></div>
  </div>

  <script src="vendor/leaflet.js"></script>
  <script type="module">
    import {
      tierOf, passesFilters, serializeHash, parseHash, TIER_COLOR,
    } from "./mapfilter.js";
    import {
      TOKEN_KEY, parseRepoMeta, loadTags, commitOps, TagSession, toggleOps, newNoteId,
      nowIso, tagButtonsHtml, notesHtml, badgesHtml, esc, writeTagHash,
      clearCommittedDrafts, noteDeleteOps,
    } from "./tags.js";

    const map = L.map("map").setView([49.75, 15.5], 7); // ~centre of Czechia
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19, attribution: "© OpenStreetMap",
    }).addTo(map);

    let state = parseHash(location.hash);
    let features = [];
    const markers = new Map(); // guid -> {marker, props}
    // consumed geojson feature properties (see geojson.py): title, price, price_label,
    // source, link, mapy_url, suitability_tier (read via mapfilter.tierOf(), falls
    // back to verdict), pin_color, flags

    // esc() comes from tags.js (also escapes ' — attributes stay double-quoted).

    // only http(s) URLs are safe as hrefs; anything else (javascript:, data:) → neutralized
    const safeHref = (u) => /^https?:\/\//i.test(u || "") ? esc(u) : "#";

    function popupHtml(p) {
      const tier = tierOf(p);
      const rawColor = p.pin_color || TIER_COLOR[tier] || TIER_COLOR.unknown;
      const color = /^#[0-9a-f]{3,8}$/i.test(rawColor) ? rawColor : TIER_COLOR.unknown;
      const flags = Array.isArray(p.flags) && p.flags.length
        ? `<div class="chips">${p.flags.map((f) => `<span class="chip">${esc(f)}</span>`).join("")}</div>` : "";
      const btns = [];
      if (p.link) btns.push(`<a href="${safeHref(p.link)}" target="_blank" rel="noopener">Listing</a>`);
      if (p.mapy_url) btns.push(`<a href="${safeHref(p.mapy_url)}" target="_blank" rel="noopener">mapy.cz</a>`);
      return `<div class="popup-card">
        <h2>${esc(p.title || "(bez názvu)")}</h2>
        <div><span class="badge" style="background:${color}">${esc(tier)}</span>
        ${p.price_label ? `<span class="price">${esc(p.price_label)}</span>` : ""}</div>
        <div style="color:#666;font-size:12px">${esc(p.source || "")}</div>
        ${flags}
        <div class="btns">${btns.join("")}</div>
        <div class="tag-ui">${tagUiHtml(p.guid)}</div>
      </div>`;
    }

    // ---- tags ----
    const repoCfg = parseRepoMeta(
      document.querySelector('meta[name="tags-repo"]')?.getAttribute("content"));
    const getToken = () => (repoCfg && localStorage.getItem(TOKEN_KEY)) || "";
    let tagsLoaded = false;
    let tokenRejected = false;
    // Half-typed notes, per guid. Every re-render (each commit landing or failing)
    // restores them; only a successful add_note of that exact text clears one.
    const drafts = new Map();
    const session = new TagSession({
      commit: (ops) => commitOps(ops, { token: getToken(), ...repoCfg }),
      onCommitted: (ops) => clearCommittedDrafts(drafts, ops),
      onChange: () => refreshTags(),
      onError: (e) => { lastErr = `zápis selhal, vráceno: ${e.message}`; tagMsg(lastErr, true); },
    });
    // The sidebar is a closed drawer on phones, so the error is ALSO shown in the
    // popup (until the next write).
    let lastErr = "";
    const tagsDoc = () => session.doc;      // null = not loaded → filters fail open
    const editable = () => !!(getToken() && tagsLoaded && !tokenRejected);

    function tagUiHtml(guid) {
      const doc = tagsDoc();
      if (!doc) return "";
      const err = lastErr ? `<div class="tag-msg tag-err">${esc(lastErr)}</div>` : "";
      return err + tagButtonsHtml(guid, doc, editable()) + notesHtml(guid, doc, editable(), drafts.get(guid) || "");
    }

    function tagMsg(text, isErr = false) {
      const el = document.getElementById("tag-msg");
      el.textContent = text;
      el.classList.toggle("tag-err", isErr);
    }

    // A tag change refreshes the open popup + badges in place; the filter is
    // re-applied when the popup closes, so a just-noped pin does not vanish
    // under the thumb (and can be un-noped).
    let tagsDirty = false;
    function refreshTags() {
      // remember a focused note box so the rebuilt one gets focus back
      const fa = document.activeElement;
      const focus = fa && fa.matches("textarea[data-guid]")
        ? { guid: fa.dataset.guid, at: fa.selectionStart } : null;
      markers.forEach(({ marker, badge, props }) => {
        if (marker.isPopupOpen()) marker.setPopupContent(popupHtml(props));
        else marker.getPopup()?.setContent(popupHtml(props));
        if (badge) badge.setIcon(badgeIcon(props.guid));
      });
      if (focus) {
        const ta = [...map.getPane("popupPane").querySelectorAll("textarea[data-guid]")]
          .find((t) => t.dataset.guid === focus.guid);
        if (ta) { ta.focus(); ta.setSelectionRange(focus.at, focus.at); }
      }
      const popupOpen = [...markers.values()].some(({ marker }) => marker.isPopupOpen());
      if (popupOpen) tagsDirty = true; else render();
    }

    const PIN_RADIUS = 8;  // was 7; +14 % (user, 2026-11-25)

    function badgeIcon(guid) {
      const d = 2 * PIN_RADIUS + 2;  // circle + its 1px stroke
      return L.divIcon({ className: "pin-badge", html: esc(badgesHtml(guid, tagsDoc())),
                         iconSize: [d, d], iconAnchor: [d / 2, d / 2] });
    }

    function onTagClick(e) {
      const el = e.target.closest("[data-act]");
      if (!el || !editable()) return;
      // Handled here: stop it before the map sees it. The submit re-renders the
      // popup synchronously, detaching e.target; Leaflet's map click handler then
      // walks a parentless node, misses the popup, and closes it.
      e.stopPropagation();
      const guid = el.dataset.guid;
      const props = markers.get(guid)?.props;
      lastErr = "";
      if (el.dataset.act === "tag") {
        session.submit(toggleOps(tagsDoc(), guid, el.dataset.tag,
          { at: nowIso(), price: props ? props.price : null }));
      } else if (el.dataset.act === "note-add") {
        const ta = el.closest(".tag-ui").querySelector("textarea");
        drafts.set(guid, ta.value);
        const text = ta.value.trim();
        if (!text) return;
        session.submit([{ op: "add_note", guid, id: newNoteId(), at: nowIso(), via: "map", text }]);
      } else if (el.dataset.act === "note-del") {
        const ops = noteDeleteOps(guid, el.dataset.id, (q) => window.confirm(q));
        if (ops.length) session.submit(ops);
      }
    }

    async function reloadTags() {
      const token = getToken();
      try {
        const r = await loadTags({ token, ...(repoCfg || {}) });
        tagsLoaded = true;
        tokenRejected = !!r.tokenRejected;
        session.setServer(r.doc);
        tagMsg(tokenRejected ? "token odmítnut — nahraď ho v ⚙"
          : token ? "" : (repoCfg ? "jen čtení — vlož token v ⚙" : "jen čtení (stránka není publikovaná)"),
          tokenRejected);
      } catch (e) {
        // fail open: no tags, nothing hidden by tags
        tagsLoaded = false;
        session.setServer(null);
        tagMsg(`štítky nedostupné: ${e.message}`, true);
      }
    }

    function wireTokenPanel() {
      const stateEl = document.getElementById("tag-token-state");
      const input = document.getElementById("tag-token");
      const show = () => {
        stateEl.textContent = !repoCfg ? "stránka není publikovaná — štítky jen pro čtení"
          : localStorage.getItem(TOKEN_KEY) ? "token uložen" : "bez tokenu (jen čtení)";
      };
      document.getElementById("tag-token-save").onclick = () => {
        const v = input.value.trim();
        input.value = "";
        if (v) localStorage.setItem(TOKEN_KEY, v);
        show(); reloadTags();
      };
      document.getElementById("tag-token-clear").onclick = () => {
        localStorage.removeItem(TOKEN_KEY);
        input.value = "";
        show(); reloadTags();
      };
      show();
    }

    function buildFlagCheckboxes() {
      const all = new Set();
      for (const f of features) for (const fl of (f.properties.flags || [])) all.add(fl);
      const box = document.getElementById("f-flags");
      box.innerHTML = [...all].sort().map((fl) =>
        `<label><input type="checkbox" data-xflag="${esc(fl)}"
          ${state.excludeFlags.has(fl) ? "checked" : ""}> skrýt ${esc(fl)}</label>`).join("");
      box.querySelectorAll("[data-xflag]").forEach((el) =>
        el.addEventListener("change", () => {
          el.checked ? state.excludeFlags.add(el.dataset.xflag)
                     : state.excludeFlags.delete(el.dataset.xflag);
          apply();
        }));
    }

    // Checked = VISIBLE. State stores the HIDDEN set, so a druh that appears in
    // the data later (or is not vetted yet) is shown without anyone ticking it —
    // the fail-open rule from mapfilter.js.
    function buildDruhCheckboxes() {
      const all = new Set();
      for (const f of features) {
        const d = f.properties.druh_pozemku;
        if (d) all.add(d);
      }
      const box = document.getElementById("f-druh");
      box.innerHTML = [...all].sort((a, b) => a.localeCompare(b, "cs")).map((d) =>
        `<label><input type="checkbox" data-druh="${esc(d)}"
          ${state.hiddenDruhs.has(d) ? "" : "checked"}> ${esc(d)}</label>`).join("");
      box.querySelectorAll("[data-druh]").forEach((el) =>
        el.addEventListener("change", () => {
          el.checked ? state.hiddenDruhs.delete(el.dataset.druh)
                     : state.hiddenDruhs.add(el.dataset.druh);
          apply();
        }));
      document.getElementById("d-all").onclick = () => {
        state.hiddenDruhs.clear(); buildDruhCheckboxes(); apply();
      };
      document.getElementById("d-none").onclick = () => {
        state.hiddenDruhs = new Set(all); buildDruhCheckboxes(); apply();
      };
    }

    function render() {
      markers.forEach(({ marker, badge }) => { marker.remove(); badge?.remove(); });
      markers.clear();
      let shown = 0;
      const doc = tagsDoc();
      for (const f of features) {
        const p = f.properties;
        if (!passesFilters(p, state, doc)) continue;
        const [lon, lat] = f.geometry.coordinates;
        const rawColor = p.pin_color || TIER_COLOR[tierOf(p)] || TIER_COLOR.unknown;
        const color = /^#[0-9a-f]{3,8}$/i.test(rawColor) ? rawColor : TIER_COLOR.unknown;
        const m = L.circleMarker([lat, lon], {
          radius: PIN_RADIUS, color: "#333", weight: 1, fillColor: color, fillOpacity: 0.9,
        }).bindPopup(popupHtml(p), { maxWidth: 280 }).addTo(map);
        const badge = badgesHtml(p.guid, doc)
          ? L.marker([lat, lon], { icon: badgeIcon(p.guid), interactive: false, keyboard: false }).addTo(map)
          : null;
        markers.set(p.guid, { marker: m, badge, props: p });
        shown++;
      }
      document.getElementById("count").textContent =
        `${shown} z ${features.length} zobrazeno`;
    }

    function apply() {
      render();
      const h = serializeHash(state);
      history.replaceState(null, "", h ? "#" + h : location.pathname);
      // carry the shared tag keys (`tag`, `nope`) over to the list
      const t = writeTagHash("", state);
      document.querySelector("a.crosslink").href = "list.html" + (t ? "#" + t : "");
    }

    function focusGuid(guid) {
      const hit = markers.get(guid);
      if (hit) { map.setView(hit.marker.getLatLng(), 15); hit.marker.openPopup(); }
    }

    // sidebar toggle — off-canvas drawer on phones (closed by default so the map
    // is usable in portrait), collapsible column on wider screens (open by default).
    const toggleEl = document.getElementById("sidebar-toggle");
    const backdropEl = document.getElementById("backdrop");
    const isNarrow = () => window.matchMedia("(max-width: 700px)").matches;

    function setNav(open) {
      document.body.classList.toggle("nav-open", open);
      toggleEl.setAttribute("aria-expanded", open ? "true" : "false");
      toggleEl.textContent = open ? "✕" : "☰";
      // on wide screens the sidebar is in flow, so collapsing resizes the map
      map.invalidateSize();
    }

    toggleEl.addEventListener("click", () => setNav(!document.body.classList.contains("nav-open")));
    backdropEl.addEventListener("click", () => setNav(false));
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") setNav(false); });
    setNav(!isNarrow());

    // wire controls
    document.querySelectorAll("[data-tier]").forEach((el) => {
      el.checked = state.tiers.has(el.dataset.tier);
      el.addEventListener("change", () => {
        el.checked ? state.tiers.add(el.dataset.tier) : state.tiers.delete(el.dataset.tier);
        apply();
      });
    });
    const maxEl = document.getElementById("f-maxprice");
    if (state.maxPrice != null) maxEl.value = state.maxPrice;
    maxEl.addEventListener("input", () => {
      const n = parseInt(maxEl.value, 10);
      state.maxPrice = Number.isFinite(n) ? n : null; apply();
    });
    const unpricedEl = document.getElementById("f-unpriced");
    unpricedEl.checked = state.includeUnpriced;
    unpricedEl.addEventListener("change", () => { state.includeUnpriced = unpricedEl.checked; apply(); });
    const structEl = document.getElementById("f-struct");
    structEl.checked = state.structuresOnly;
    structEl.addEventListener("change", () => { state.structuresOnly = structEl.checked; apply(); });
    document.querySelectorAll("[data-only]").forEach((el) => {
      el.checked = state.onlyTags.has(el.dataset.only);
      el.addEventListener("change", () => {
        el.checked ? state.onlyTags.add(el.dataset.only) : state.onlyTags.delete(el.dataset.only);
        apply();
      });
    });
    const nopeEl = document.getElementById("f-nope");
    nopeEl.checked = state.showNope;
    nopeEl.addEventListener("change", () => { state.showNope = nopeEl.checked; apply(); });

    // Popup clicks: Leaflet stops click propagation at the popup container, so
    // listen in the CAPTURE phase on the pane above it. Keydown is stopped at the
    // pane so typing +/-/arrows in a note does not zoom/pan the map (Leaflet's
    // keyboard handler does not look at the event target).
    const popupPane = map.getPane("popupPane");
    popupPane.addEventListener("click", onTagClick, true);
    popupPane.addEventListener("keydown", (e) => e.stopPropagation());
    popupPane.addEventListener("input", (e) => {
      if (e.target.matches("textarea[data-guid]")) drafts.set(e.target.dataset.guid, e.target.value);
    });
    map.on("popupclose", () => { if (tagsDirty) { tagsDirty = false; render(); } });
    wireTokenPanel();

    fetch("points.geojson")
      .then((r) => r.json())
      .then((fc) => {
        features = (fc.features || []).filter(
          (f) => f.geometry && f.geometry.type === "Point");
        buildFlagCheckboxes();
        buildDruhCheckboxes();
        apply();
        if (state.focusGuid) focusGuid(state.focusGuid);
        reloadTags();
      })
      .catch((e) => {
        document.getElementById("count").textContent = "chyba načítání points.geojson: " + e;
      });
  </script>
</body>
</html>
